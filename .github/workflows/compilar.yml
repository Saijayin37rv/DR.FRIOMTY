name: Mi Compilación Automática

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias
      run: npm install
      working-directory: ./WEB  # <--- Aquí le decimos que entre a la carpeta

    - name: Compilar proyecto
      run: npm run build
      working-directory: ./WEB  # <--- Aquí también
